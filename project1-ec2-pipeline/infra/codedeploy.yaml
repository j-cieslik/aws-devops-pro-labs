AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Projekt 1 / lekcja 2 - CodeDeploy: bucket na paczki, rola dla CodeDeploy,
  aplikacja i deployment group wskazujaca serwery z Auto Scaling group.

Parameters:
  ProjectName:
    Type: String
    Default: p1

Resources:
  # Tu wrzucamy paczki ZIP z aplikacja (na razie recznie, pozniej zrobi to pipeline).
  RevisionsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-revisions-${AWS::AccountId}"
      VersioningConfiguration: { Status: Enabled }

  # Rola, ktora CodeDeploy przyjmuje, zeby moc ogladac serwery, ASG i load balancer.
  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codedeploy.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSCodeDeployRole
      # Lekcja 7: przy blue/green CodeDeploy sam tworzy nowe serwery z launch template,
      # wiec potrzebuje uprawnien do ich uruchomienia i nadania im roli instancji.
      Policies:
        - PolicyName: blue-green-launch-template
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ec2:RunInstances, ec2:CreateTags]
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: "*"
                Condition:
                  StringEquals: { "iam:PassedToService": ec2.amazonaws.com }

  # "Aplikacja" w CodeDeploy to tylko nazwa-pojemnik na deployment groups i historie wdrozen.
  Application:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub "${ProjectName}-app"
      ComputePlatform: Server

  # Deployment group = NA KTORE serwery i JAK wdrazac.
  DeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref Application
      DeploymentGroupName: !Sub "${ProjectName}-dg"
      ServiceRoleArn: !GetAtt CodeDeployServiceRole.Arn
      # NA KTORE: wszystkie serwery z naszej Auto Scaling group.
      AutoScalingGroups:
        - Fn::ImportValue: !Sub "${ProjectName}-asg-name"
      # JAK: po jednym serwerze naraz, z odpinaniem go od load balancera na czas podmiany.
      # Lekcja 7: CloudFormation NIE obsluguje blue/green na EC2 (tylko Lambda; ECS przez
      # AWS::CodeDeploy::BlueGreen hook), wiec blue/green wlaczamy skryptem enable-blue-green.ps1.
      DeploymentConfigName: CodeDeployDefault.OneAtATime
      DeploymentStyle:
        DeploymentType: IN_PLACE
        DeploymentOption: WITH_TRAFFIC_CONTROL
      LoadBalancerInfo:
        TargetGroupInfoList:
          - Name:
              Fn::ImportValue: !Sub "${ProjectName}-tg-name"
      # Lekcja 5: CodeDeploy obserwuje ten alarm W TRAKCIE wdrozenia.
      # Gdy alarm zapali sie na czerwono -> zatrzymaj wdrozenie.
      AlarmConfiguration:
        Enabled: true
        Alarms:
          - Name: !Ref Http5xxAlarm
      # ...i automatycznie wroc do poprzedniej dzialajacej wersji
      # (zarowno gdy zapali sie alarm, jak i gdy wdrozenie po prostu sie nie uda).
      AutoRollbackConfiguration:
        Enabled: true
        Events: [DEPLOYMENT_FAILURE, DEPLOYMENT_STOP_ON_ALARM]

  # Alarm: "w ciagu minuty serwery zwrocily uzytkownikom 5 lub wiecej bledow 5xx".
  Http5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-target-5xx"
      AlarmDescription: Aplikacja zwraca bledy 5xx przez load balancer
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: { "Fn::ImportValue": !Sub "${ProjectName}-alb-fullname" }
        - Name: TargetGroup
          Value: { "Fn::ImportValue": !Sub "${ProjectName}-tg-fullname" }
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # Brak danych (brak bledow) = wszystko w porzadku.
      TreatMissingData: notBreaching

Outputs:
  RevisionsBucketName:
    Value: !Ref RevisionsBucket
    Export: { Name: !Sub "${ProjectName}-revisions-bucket" }
