# SAM template: a short description of a serverless app.
# SAM is an extension of CloudFormation - during deployment it expands these few lines
# into many regular CloudFormation resources (function, role, version, alias, API, permissions).
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Project 3 - Lambda function with an HTTP API, deployed with SAM and CodeDeploy canary.

Resources:
  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.handler
      Runtime: nodejs22.x
      Architectures: [x86_64]
      MemorySize: 128
      Timeout: 5
      # Every deployment with changed code publishes a new version
      # and points the "live" alias at it.
      AutoPublishAlias: live
      # Lesson 3: do not move the alias at once - let CodeDeploy shift traffic gradually.
      DeploymentPreference:
        Type: Canary10Percent5Minutes       # 10% for 5 minutes, then 100%
        Alarms:
          - !Ref AliasErrorsAlarm           # errors during the 5 minutes -> automatic rollback
        Hooks:
          PreTraffic: !Ref PreTrafficHook   # test the new version before it gets ANY traffic
      Events:
        Hello:
          Type: HttpApi
          Properties:
            Path: /hello
            Method: GET

  # Alarm: at least 1 error from the "live" alias within a minute.
  AliasErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Errors from the live alias of HelloFunction
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref HelloFunction
        - Name: Resource
          Value: !Sub "${HelloFunction}:live"
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # Test run by CodeDeploy before traffic shifting starts (like the port 8080 test in project 2).
  # The name must start with CodeDeployHook_ - the CodeDeploy role may only invoke such functions.
  PreTrafficHook:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "CodeDeployHook_${AWS::StackName}-preTraffic"
      CodeUri: hooks/
      Handler: preTraffic.handler
      Runtime: nodejs22.x
      Timeout: 30
      DeploymentPreference:
        Enabled: false
      Environment:
        Variables:
          NEW_VERSION: !Ref HelloFunction.Version   # ARN of the version being deployed
      Policies:
        - Statement:
            - Effect: Allow
              Action: codedeploy:PutLifecycleEventHookExecutionStatus
              Resource: "*"
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Ref HelloFunction.Version

Outputs:
  HelloUrl:
    Description: URL of the function behind the HTTP API
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/hello"
